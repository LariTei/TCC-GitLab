stages:
  - build
  - linter
  - test
  - deploy

# Etapa 1: Validação estática de sintaxe e boas práticas
django_linter:
  stage: linter
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pip install --upgrade pip
    - pip install django djangorestframework
    - python manage.py check

# # Etapa 2: Simulação de montagem do Banco de Dados simulando o ambiente produtivo
