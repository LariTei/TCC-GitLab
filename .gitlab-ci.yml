automação_build:
  image: alpine
  stage: build
  script:
    - echo "Building"
    - mkdir build
    - touch build/info.txt

teste:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.1-noble
  variables:
    APP_BASE_URL: 'http://127.0.0.1:8000/admin'
    DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    # Defina o PYTHONPATH aqui para ajudar o container a enxergar a raiz do projeto e a pasta src antes de invocar os testes
    PYTHONPATH: ".:src"
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
    - playwright install chromium --with-deps
  script:
    - pytest
    - pytest --html=report.html --self-contained-html --cov=src --cov-report=term-missing --cov-report=html:htmlcov --junitxml=report.xml --reuse-db