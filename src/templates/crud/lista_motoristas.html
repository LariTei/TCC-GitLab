<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><title>Motoristas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light-subtle container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gerenciamento de Motoristas</h2>
    <div>
        <a href="{% url 'index' %}" class="btn btn-secondary">Voltar ao Menu</a>
        <a href="{% url 'criar_motorista' %}" class="btn btn-primary">+ Novo Motorista</a>
    </div>
</div>
<table class="table table-striped bg-white shadow-sm rounded">
    <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Email</th><th>Ações</th></tr></thead>
    <tbody>
    {% for m in motoristas %}
    <tr>
        <td>{{ m.nome }}</td><td>{{ m.cpf }}</td><td>{{ m.telefone }}</td><td>{{ m.email }}</td>
        <td>
            <a href="{% url 'editar_motorista' m.pk %}" class="btn btn-sm btn-warning">Editar</a>
            <a href="{% url 'deletar_motorista' m.pk %}" class="btn btn-sm btn-danger">Deletar</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-center text-muted">Nenhum motorista cadastrado.</td></tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
