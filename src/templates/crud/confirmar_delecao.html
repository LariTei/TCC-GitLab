<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">

                    <!-- Ícone de Alerta -->
                    <div class="mb-3">
                        <i class="fa-solid fa-triangle-exclamation fa-3x text-danger"></i>
                    </div>

                    <h3 class="card-title mb-3">Tem certeza que deseja excluir?</h3>

                    <p class="text-muted">
                        Você está prestes a remover o registro: <br>
                        <strong class="text-dark">{{ objeto }}</strong>
                    </p>

                    <div class="alert alert-warning small text-start" role="alert">
                        <i class="fa-solid fa-info-circle me-1"></i>
                        Atenção: Esta ação é irreversível. Se houver dados dependentes (como automóveis ou consertos vinculados), a exclusão poderá ser impedida pelo sistema.
                    </div>

                    <!-- Formulário de Confirmação POST -->
                    <form method="POST" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <!-- Botão de Cancelar (Retorna para a listagem correspondente) -->
                            <a href="{% url voltar %}" class="btn btn-secondary px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Cancelar
                            </a>

                            <!-- Botão de Confirmar Deleção -->
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="fa-solid fa-trash me-1"></i> Sim, Excluir
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
