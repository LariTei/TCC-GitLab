<!-- src/templates/crud/lista_automoveis.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Automóveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-4">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Automóveis Cadastrados</h1>
    <div>
        <a href="{% url 'index' %}" class="btn btn-secondary">Voltar ao Menu</a>
        <a href="{% url 'criar_automovel' %}" class="btn btn-primary">+ Novo Automóvel</a>
    </div>
</div>
<table class="table table-striped bg-white shadow-sm rounded">
    <thead>
    <tr>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Ano</th>
        <th>Proprietário</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    {% for automovel in automoveis %}
    <tr>
        <td>{{ automovel.marca }}</td>
        <td>{{ automovel.modelo }}</td>
        <td>{{ automovel.ano }}</td>
        <td>{{ automovel.motorista.nome }}</td>
        <td>
            <a href="{% url 'editar_automovel' automovel.id %}" class="btn btn-sm btn-warning">Editar</a>
            <a href="{% url 'deletar_automovel' automovel.id %}" class="btn btn-sm btn-danger">Deletar</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="8" class="text-center text-muted">Nenhum automóvel cadastrado.</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
